name: CI (PRs/branches)

on:
  push:
    branches-ignore:
      - "gh-pages"

  pull_request:
  merge_group:

concurrency:
  group: "kordex-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # if this is a fork, still run on the root branch
    if: github.event_name != 'push' || github.repository != 'Kord-Extensions/kord-extensions' || github.ref_name != 'root'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4

        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-XX:MaxMetaspaceSize=5G" >> ~/.gradle/gradle.properties

      - name: SonarQube (Cache)
        uses: actions/cache@v4

        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle (Setup)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

        with:
          package_json_file: modules/web/web-core/web-frontend/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4

        with:
          node-version-file: modules/web/web-core/web-frontend/package.json
          cache-dependency-path: modules/web/web-core/web-frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: Gradle (Build)
        run: "./gradlew checkLicenses build koverXmlReport sonar"

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

          TOKEN: "${{ secrets.TOKEN }}"

      - name: Upload artifact (Core JARs)
        uses: actions/upload-artifact@v4

        with:
          name: JARs (Core)
          path: kord-extensions/build/libs/*.jar

      - name: Upload artifact (Annotation JARs)
        uses: actions/upload-artifact@v4

        with:
          name: JARs (Annotation)
          path: annotations/**/build/libs/*.jar

      - name: Upload artifact (Module JARs)
        uses: actions/upload-artifact@v4

        with:
          name: JARs (Modules)
          path: modules/**/build/libs/*.jar

      - name: Upload artifact (Parser JARs)
        uses: actions/upload-artifact@v4

        with:
          name: JARs (Parser)
          path: token-parser/build/libs/*.jar
