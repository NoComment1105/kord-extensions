name: "CodeQL"

on:
  push:
    branches:
      - root

  pull_request:
    branches:
      - root

  schedule:
    - cron: '19 21 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

      matrix:
        language: [ java-kotlin ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4

        with:
          java-version: 17
          distribution: temurin

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

        with:
          package_json_file: modules/web/web-core/web-frontend/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4

        with:
          node-version-file: modules/web/web-core/web-frontend/package.json
          cache-dependency-path: modules/web/web-core/web-frontend/pnpm-lock.yaml
          cache: "pnpm"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3

        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

        with:
          category: "/language:${{matrix.language}}"
