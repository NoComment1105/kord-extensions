#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"

ide: QDJVM

profile:
  path: "qodana-profile.yaml"

projectJDK: "21"

plugins:
  - id: "JavaScript"
  - id: "com.intellij.exposed"
  - id: "com.intellij.gradle"
  - id: "org.editorconfig.editorconfigjetbrains"
  - id: "org.jetbrains.kotlin"
  - id: "org.jetbrains.plugins.vue"
  - id: "org.jetbrains.security.package-checker"

